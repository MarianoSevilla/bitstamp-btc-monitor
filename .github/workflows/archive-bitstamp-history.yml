name: Bitstamp historical BTCUSD archive

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/archive-bitstamp-history.yml"
      - "scripts/archive_bitstamp_history.py"

permissions:
  contents: write

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Retrieve and validate Bitstamp original BTCUSD daily history
        run: python scripts/archive_bitstamp_history.py
      - name: Publish only market history, no account details
        run: |
          git add data/history/
          if ! git diff --cached --quiet --exit-code; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "data: archive Bitstamp historical daily BTCUSD"
            git push
          fi
